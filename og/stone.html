<!doctype html>
<html lang="en" class="rk lt">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../static/rok.css">
<style>
@font-face{font-family:"Geist";src:url("fonts/geist.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url("fonts/geist-mono.woff2") format("woff2");font-weight:500;font-display:block}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{width:1200px;height:630px;box-sizing:border-box;display:flex;flex-direction:column;padding:64px 72px;background:oklch(0.975 0.015 {{HUE}})}
.top{display:flex;align-items:center;gap:12px;font-size:26px;line-height:32px;font-weight:600}
.row{display:flex;align-items:center;gap:32px;margin-top:64px}
.box{width:148px;height:148px;border-radius:36px;background:oklch(0.93 0.04 {{HUE}});display:flex;align-items:center;justify-content:center;flex:none}
.what{display:flex;flex-direction:column;gap:10px;min-width:0}
.name{display:flex;align-items:baseline;gap:18px}
h1{font-family:var(--mono);font-size:92px;line-height:96px;letter-spacing:-0.03em;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font-family:var(--mono);font-size:36px;color:var(--ink-3)}
p{margin:0;font-size:28px;line-height:38px;color:var(--ink-2);max-width:22em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft{margin-top:auto;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:22px;line-height:28px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="og">
  <span class="top"><img src="logo.svg" alt="" width="40" height="40">rokstones</span>
  <div class="row">
    <span class="box"><svg width="92" height="92" viewBox="0 0 64 64"><path d="M30 4C47 3 61 15 61 31C62 48 49 61 33 61C15 61 3 50 3 33C2 16 14 5 30 4Z" fill="oklch(0.66 0.14 {{HUE}})" transform="rotate({{ROT}} 32 32) translate(32 32) scale({{SX}} 1) translate(-32 -32)"/></svg></span>
    <div class="what"><div class="name"><h1>{{NAME}}</h1><span class="ver">{{VERS}}</span></div><p>{{DESC}}</p></div>
  </div>
  <div class="ft"><span style="color:var(--acc)">$</span><span style="color:var(--ink)">rok add {{NAME}}</span><span style="margin-left:auto">rokstones.io</span></div>
</div>
</body>
</html>
