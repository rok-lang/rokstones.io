name: deploy

# Deploy rokstones to its EC2 origin (which serves both the static registry
# pages and the dynamic API/auth). A push to main rebuilds the static site
# and ships it (rsync public/ + restart). A manual run with full=true also
# rebuilds the server binary (rare). A CDN can sit in front for edge caching.
#
# Access (set once, EC2 only — never the home boxes):
#   - OIDC: the rok-ci-deploy IAM role trusts this repo; it may authorize/
#     revoke the security group's port 22.
#   - secrets.ROK_DEPLOY_KEY: the CI SSH private key, whose public key is in
#     the box's ubuntu authorized_keys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the server binary too (otherwise static only)."
        type: boolean
        default: false

concurrency:
  group: deploy-rokstones
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  EIP: 54.204.70.72
  SG: sg-0cc6c5ea1027f890b
  AWS_ROLE: arn:aws:iam::893677554379:role/rok-ci-deploy
  AWS_REGION: us-east-1
  TOOLCHAIN: aarch64-unknown-linux-gnu
  CF_ZONE: 2bdf0605414dcecb9a81f17b7a8b403c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rokstones.io
      - uses: actions/checkout@v4
        with:
          repository: rok-lang/rokstones.io-index
          path: rokstones.io-index

      - name: Install the rok toolchain
        run: |
          curl -fsSL https://rok-lang.org/install.sh | sh
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"
      - name: Build the static site
        working-directory: rokstones.io
        run: rok run
      - name: Render OG cards
        working-directory: rokstones.io
        run: |
          npm --prefix og ci
          node og/render.mjs public og/manifest.tsv || echo "warning: og render failed"
      - name: Build the server (full)
        if: ${{ inputs.full }}
        working-directory: rokstones.io
        run: |
          rok build --release --target "$TOOLCHAIN"
          mkdir -p target/release
          cp "target/$TOOLCHAIN/release/rokstones_io" target/release/rokstones_io

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ROK_DEPLOY_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id

      - name: Open SSH to this runner
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          aws ec2 authorize-security-group-ingress --group-id "$SG" \
            --protocol tcp --port 22 --cidr "$IP/32" --region "$AWS_REGION"
          echo "RUNNER_CIDR=$IP/32" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            ssh-keyscan -T 5 -H "$EIP" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 3
          done

      - name: Deploy static (push / default)
        if: ${{ ! inputs.full }}
        working-directory: rokstones.io
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id" public/ "ubuntu@$EIP:/tmp/rks-public/"
          ssh -i ~/.ssh/id "ubuntu@$EIP" '
            sudo rsync -a --delete /tmp/rks-public/ /srv/rokstones/public/ &&
            sudo chown -R rokstones:rokstones /srv/rokstones/public &&
            sudo systemctl restart rokstones && sleep 1 &&
            systemctl --no-pager status rokstones | head -3'

      - name: Deploy full (manual)
        if: ${{ inputs.full }}
        working-directory: rokstones.io
        run: |
          cat > ~/.ssh/config <<CFG
          Host $EIP
            IdentityFile ~/.ssh/id
            IdentitiesOnly yes
          CFG
          chmod 600 ~/.ssh/config
          deploy/deploy.sh "ubuntu@$EIP"

      - name: Purge the CDN cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | grep -q '"success":true' && echo "cache purged" || { echo "purge failed"; exit 1; }

      - name: Close SSH (always)
        if: always()
        run: |
          [ -n "${RUNNER_CIDR:-}" ] && aws ec2 revoke-security-group-ingress --group-id "$SG" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" --region "$AWS_REGION" || true
