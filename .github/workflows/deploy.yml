name: deploy

# Build rokstones.io's static registry site and push it to Cloudflare Pages
# on every change to main. Needs repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (a token with Account > Cloudflare Pages: Edit).
# The dynamic API runs on the backend (deploy/, EC2) and is released there.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: rokstones.io
      - name: Checkout the registry index
        uses: actions/checkout@v4
        with:
          repository: rok-lang/rokstones.io-index
          path: rokstones.io-index

      - name: Install the rok toolchain
        run: |
          curl -fsSL https://rok-lang.org/install.sh | sh
          echo "$HOME/.rok/bin" >> "$GITHUB_PATH"
      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Build and deploy
        working-directory: rokstones.io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "PATH=$PATH"; command -v rok || echo "NO ROK"; rok --version || true
          ls -la .. deploy/cloudflare
          sh -x deploy/cloudflare/deploy.sh
